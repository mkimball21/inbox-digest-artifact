<style>
  :root {
    --bg: #EDEEEA;
    --ink: #23241F;
    --navy: #1D3557;
    --mustard: #C98A2D;
    --card-bg: #FFFFFF;
    --border: #D8D6CC;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    line-height: 1.5;
  }

  .mono {
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.82rem;
    color: #55564d;
  }

  header.page-header {
    padding: 1.5rem 1.25rem 1rem;
    border-bottom: 2px solid var(--navy);
    position: relative;
  }

  h1 {
    margin: 0 0 0.75rem;
    font-size: 1.6rem;
    letter-spacing: 0.02em;
    color: var(--navy);
  }

  .controls-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    align-items: center;
  }

  select, button {
    font-family: inherit;
    font-size: 0.95rem;
    padding: 0.4rem 0.7rem;
    border: 1px solid var(--navy);
    border-radius: 3px;
    background: var(--card-bg);
    color: var(--ink);
    cursor: pointer;
  }

  button.primary {
    background: var(--navy);
    color: #fff;
  }

  button:disabled { opacity: 0.5; cursor: default; }

  .date-badge {
    position: absolute;
    top: 1.25rem;
    right: 1.25rem;
    transform: rotate(-6deg);
    border: 2px solid var(--mustard);
    color: var(--mustard);
    font-family: 'Courier New', monospace;
    font-weight: bold;
    padding: 0.3rem 0.6rem;
    border-radius: 4px;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    background: rgba(201, 138, 45, 0.08);
  }

  .jump-bar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--navy);
    color: #fff;
    display: flex;
    gap: 1.25rem;
    padding: 0.55rem 1.25rem;
    font-size: 0.9rem;
  }

  .jump-bar a {
    color: #fff;
    text-decoration: none;
    opacity: 0.85;
    cursor: pointer;
  }
  .jump-bar a:hover { opacity: 1; text-decoration: underline; }

  main { max-width: 760px; margin: 0 auto; padding: 1.25rem; }

  /* B2: long unbroken tokens (tracking URLs up to ~1,500 chars in real
     bodies) inside pre-wrap text forced the page wider than the screen.
     Let any text container break anywhere when it has to. */
  .message-body, .summary-text, .card-subject, .card-meta, .mono,
  .message-from, .raw-from, #contents-list li, .bulk-status {
    overflow-wrap: anywhere;
    word-break: break-word;
  }
  .card-header > div:first-child { min-width: 0; flex: 1 1 14rem; }

  section.digest-section { margin-bottom: 2.5rem; }

  section.digest-section > h2 {
    font-size: 1.15rem;
    color: var(--navy);
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.4rem;
  }

  #contents-list { padding-left: 1.2rem; }
  #contents-list li { margin-bottom: 0.35rem; cursor: pointer; }
  #contents-list li:hover { text-decoration: underline; }
  #contents-list .contents-sender { color: #55564d; font-size: 0.9rem; }
  #contents-list .contents-time { color: #55564d; font-size: 0.82rem; font-family: 'Courier New', Courier, monospace; margin-left: 0.1rem; }

  /* Round 2 #6: jump targets land fully below the sticky navy bar. */
  section.digest-section, .card { scroll-margin-top: 3.4rem; }

  .digest-counts { margin: -0.35rem 0 0.75rem; font-size: 0.9rem; color: #55564d; font-style: italic; }
  #contents-list .day-scope-note { color: var(--mustard); font-style: italic; font-size: 0.85rem; margin-left: 0.4rem; }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1rem 1.1rem;
    margin-bottom: 1rem;
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  .card-subject { font-size: 1.05rem; font-weight: bold; }
  .card-meta { font-size: 0.88rem; color: #3d3e37; margin-top: 0.2rem; }
  .card-meta .meta-label { color: #77786e; }
  .item-num { color: var(--navy); }

  .message-from .sender-name { font-weight: bold; }
  .message-from .msg-time { font-family: 'Courier New', Courier, monospace; font-size: 0.82rem; color: #55564d; margin-left: 0.4rem; }
  .raw-from { font-size: 0.78rem; color: #77786e; }

  .status-icons { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; white-space: nowrap; }
  /* B6: read state is a passive chip; the action is a separate labeled button. */
  .state-chip {
    display: inline-block;
    font-size: 0.78rem;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: #55564d;
    background: var(--bg);
    cursor: default;
    user-select: none;
  }
  .state-chip.unread { border-color: var(--mustard); color: #8a5d16; background: rgba(201, 138, 45, 0.12); font-weight: bold; }
  .icon-btn {
    border: 1px solid var(--border);
    background: var(--card-bg);
    border-radius: 3px;
    padding: 0.25rem 0.5rem;
    font-size: 0.85rem;
    cursor: pointer;
    font-family: inherit;
  }
  .icon-btn.active { background: var(--mustard); color: #fff; border-color: var(--mustard); }
  .icon-btn:disabled { opacity: 0.6; cursor: default; }

  .bulk-status { font-size: 0.9rem; color: #55564d; }
  .bulk-status.ok { color: #2f6b3a; }
  .bulk-status.error { color: #a63d3d; font-weight: bold; }

  .summary-text { margin-top: 0.6rem; white-space: pre-wrap; }
  .summary-status-note { margin-top: 0.6rem; font-style: italic; color: #8a6d1f; }
  .summary-status-note.failed { color: #a63d3d; }

  .jump-link { font-size: 0.85rem; color: var(--navy); cursor: pointer; text-decoration: underline; }

  .day-scoping-label {
    display: inline-block;
    margin-top: 0.3rem;
    font-size: 0.8rem;
    color: var(--mustard);
  }

  .message-block { border-top: 1px dashed var(--border); padding-top: 0.6rem; margin-top: 0.6rem; }
  .message-block:first-child { border-top: none; margin-top: 0; padding-top: 0; }
  .message-body { white-space: pre-wrap; margin-top: 0.4rem; }

  /* B7: smaller, and kept inside a right-hand gutter so it never sits on text. */
  #back-to-top {
    position: fixed;
    bottom: 1rem;
    right: 1rem;
    border-radius: 50%;
    width: 2.25rem;
    height: 2.25rem;
    padding: 0;
    background: var(--navy);
    color: #fff;
    border: none;
    font-size: 1rem;
    line-height: 2.25rem;
    cursor: pointer;
    display: none;
    opacity: 0.85;
    box-shadow: 0 1px 4px rgba(0,0,0,0.25);
  }
  #back-to-top:hover { opacity: 1; }

  /* Below ~900px the centered column reaches the button's corner, so reserve
     a right gutter wide enough for the button and pin it inside that gutter. */
  @media (max-width: 900px) {
    main { padding-right: 2.75rem; }
    #back-to-top { width: 2rem; height: 2rem; line-height: 2rem; font-size: 0.9rem; right: 0.35rem; bottom: 0.75rem; }
  }

  .empty-state, .error-state {
    padding: 3rem 1rem;
    text-align: center;
    color: #55564d;
    font-size: 1.05rem;
  }

  .loading-note { padding: 1.5rem; text-align: center; color: #55564d; }

  @media (max-width: 480px) {
    main { padding-left: 0.9rem; }
    .card { padding: 0.85rem 0.8rem; }
    .date-badge { position: static; display: inline-block; transform: rotate(-3deg); margin-top: 0.5rem; }
    header.page-header { padding-bottom: 0.5rem; }
  }
</style>

<header class="page-header">
  <h1>Inbox Digest</h1>
  <div class="digest-counts" id="digest-counts"></div>
  <div class="controls-row">
    <select id="date-select"></select>
    <button id="regenerate-btn" title="Re-run parsing + summarization for this date">Regenerate</button>
    <button id="mark-all-read-btn" class="primary">Mark all read</button>
    <span class="bulk-status" id="bulk-status" role="status" aria-live="polite"></span>
  </div>
  <div class="date-badge" id="date-badge"></div>
</header>

<div class="jump-bar" id="jump-bar" style="display:none;">
  <a data-jump="contents">Contents</a>
  <a data-jump="summaries">Summaries</a>
  <a data-jump="full-emails">Full emails</a>
</div>

<main id="main-content">
  <div class="loading-note" id="loading-note">Loading available dates…</div>
</main>

<button id="back-to-top" title="Back to top" aria-label="Back to top">↑</button>

<script>
  var currentDigest = null;
  var currentReadStarState = null;
  var currentDate = null;

  function byId(id) { return document.getElementById(id); }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ---- Boot: list dates, load the newest one ----
  google.script.run
    .withSuccessHandler(function (dates) {
      var select = byId('date-select');
      if (!dates || dates.length === 0) {
        byId('main-content').innerHTML = '<div class="empty-state">No digests have been generated yet.</div>';
        return;
      }
      dates.forEach(function (d) {
        var opt = document.createElement('option');
        opt.value = d;
        opt.textContent = d;
        select.appendChild(opt);
      });
      select.addEventListener('change', function () { loadDate(select.value); });
      loadDate(dates[0]);
    })
    .withFailureHandler(function (err) {
      byId('main-content').innerHTML = '<div class="error-state">Failed to list available dates: ' + escapeHtml(err.message || err) + '</div>';
    })
    .listAvailableDates();

  // F1: display name only — drop "<email>", surrounding quotes, and a
  // trailing " via X" / " (via X)" (Google Groups / list relays).
  function senderDisplayName(from) {
    var raw = String(from || '').trim();
    var name = raw.replace(/\s*<[^>]*>\s*$/, '').trim();
    name = name.replace(/^"(.*)"$/, '$1').replace(/^'(.*)'$/, '$1').trim();
    var noVia = name.replace(/\s*\(via\s+[^)]*\)\s*$/i, '').replace(/\s+via\s+\S.*$/i, '').trim();
    if (noVia) name = noVia;
    if (!name) {
      var addr = raw.match(/<([^>]+)>/);
      name = addr ? addr[1] : raw;
    }
    return name;
  }

  // "2026-11-07 07:22:41" -> "07:22". Falls back to the raw value.
  function timeOf(ts) {
    var m = String(ts == null ? '' : ts).match(/(\d{1,2}:\d{2})(?::\d{2})?/);
    return m ? m[1] : String(ts == null ? '' : ts);
  }

  // Earliest / latest timestamp in a thread. The server's format
  // (YYYY-MM-DD HH:MM:SS) sorts correctly as a string.
  function threadTimeRange(t) {
    var ts = t.messages.map(function (m) { return String(m.timestamp || ''); }).filter(Boolean).sort();
    return { first: ts[0] || '', last: ts[ts.length - 1] || '' };
  }

  function contentsSender(t) {
    var names = [];
    var seen = {};
    t.messages.forEach(function (m) {
      var n = senderDisplayName(m.from);
      var key = n.toLowerCase();
      if (n && !seen[key]) { seen[key] = true; names.push(n); }
    });
    if (!names.length) return '';
    return names[0] + (names.length > 1 ? ' +' + (names.length - 1) : '');
  }

  // B5: summaries can contain markdown bold (**Key messages**); strip the
  // markers at display time only — stored digest data is untouched.
  function displaySummary(s) {
    return String(s == null ? '' : s).replace(/\*\*/g, '');
  }

  var bulkInFlight = false;

  function setBulkStatus(text, kind) {
    var el = byId('bulk-status');
    el.textContent = text || '';
    el.className = 'bulk-status' + (kind ? ' ' + kind : '');
  }

  function loadDate(dateStr) {
    currentDate = dateStr;
    byId('digest-counts').textContent = '';
    if (!bulkInFlight) setBulkStatus('');
    byId('date-select').value = dateStr;
    byId('date-badge').textContent = dateStr;
    byId('jump-bar').style.display = 'none';
    byId('main-content').innerHTML = '<div class="loading-note">Loading digest for ' + escapeHtml(dateStr) + '…</div>';

    google.script.run
      .withSuccessHandler(handleDigestResponse)
      .withFailureHandler(function (err) {
        byId('main-content').innerHTML = '<div class="error-state">Failed to load digest: ' + escapeHtml(err.message || err) + '</div>';
      })
      .getDigestForDate(dateStr);
  }

  function handleDigestResponse(response) {
    if (response.status === 'not-found') {
      byId('main-content').innerHTML = '<div class="empty-state">No report found for ' + escapeHtml(response.date) + '.</div>';
      return;
    }
    if (response.status === 'empty') {
      byId('main-content').innerHTML = '<div class="empty-state">No emails in the archive for ' + escapeHtml(response.date) + '.</div>';
      return;
    }
    currentDigest = response.digest;
    currentReadStarState = response.readStarState;
    renderCounts(currentDigest);
    renderDigest();
  }

  // Round 2 #1: "N emails across M threads", from the digest's own totals
  // (falls back to counting only if an older digest lacks the fields).
  function renderCounts(digest) {
    var threads = digest.threads || [];
    var nEmails = typeof digest.totalEmails === 'number' ? digest.totalEmails
      : threads.reduce(function (a, t) { return a + t.messages.length; }, 0);
    var nThreads = typeof digest.totalThreads === 'number' ? digest.totalThreads : threads.length;
    byId('digest-counts').textContent = nEmails + ' email' + (nEmails === 1 ? '' : 's') +
      ' across ' + nThreads + ' thread' + (nThreads === 1 ? '' : 's');
  }

  function renderDigest() {
    var digest = currentDigest;
    byId('jump-bar').style.display = 'flex';

    // B1: the <ol> supplies the number; no manual "(i + 1). " prefix.
    var contentsHtml = digest.threads.map(function (t) {
      var scopeNote = t.spansMultipleDays
        ? '<span class="day-scope-note">(' + t.messages.length + ' message' + (t.messages.length === 1 ? '' : 's') + ' on this date)</span>'
        : '';
      var sender = contentsSender(t);
      var senderHtml = sender ? ' <span class="contents-sender">— ' + escapeHtml(sender) + '</span>' : '';
      var first = threadTimeRange(t).first;
      var timeHtml = first ? ' <span class="contents-time">' + escapeHtml(timeOf(first)) + '</span>' : '';
      return '<li data-jump-target="summary-' + t.threadId + '">' + escapeHtml(t.subject) + senderHtml + timeHtml + scopeNote + '</li>';
    }).join('');

    var summariesHtml = digest.threads.map(renderSummaryCard).join('');
    var fullEmailsHtml = digest.threads.map(renderFullEmailCard).join('');

    byId('main-content').innerHTML =
      '<section class="digest-section" id="contents">' +
        '<h2>Contents</h2>' +
        '<ol id="contents-list">' + contentsHtml + '</ol>' +
      '</section>' +
      '<section class="digest-section" id="summaries">' +
        '<h2>Summaries</h2>' +
        summariesHtml +
      '</section>' +
      '<section class="digest-section" id="full-emails">' +
        '<h2>Full emails</h2>' +
        fullEmailsHtml +
      '</section>';

    wireContentsJumpLinks();
    wireStatusIconButtons();
    wireFullBodyButtons();
  }

  // Round 2 #3: labeled From / Received lines; replaces participantsLine().
  // Uses the same contentsSender()/senderDisplayName() as Contents so the
  // names match exactly.
  function metaLines(t) {
    var sender = contentsSender(t);
    var range = threadTimeRange(t);
    var n = t.messages.length;
    var received = '';
    if (range.first) {
      received = timeOf(range.first);
      if (n > 1) {
        var last = timeOf(range.last);
        if (last !== received) received += ' to ' + last;
        received += ' (' + n + ' messages)';
      }
    }
    return (
      (sender ? '<div class="card-meta"><span class="meta-label">From:</span> <span class="meta-from">' + escapeHtml(sender) + '</span></div>' : '') +
      (received ? '<div class="card-meta"><span class="meta-label">Received:</span> <span class="meta-received">' + escapeHtml(received) + '</span></div>' : '')
    );
  }

  // Round 2 #5: same item number as Contents' <ol>.
  function numberedSubject(t, i) {
    return '<span class="item-num">' + (i + 1) + '.</span> ' + escapeHtml(t.subject);
  }

  function renderSummaryCard(t, i) {
    var state = currentReadStarState[t.threadId] || { isRead: false, isStarred: false };
    var scopeLabel = t.spansMultipleDays
      ? '<div class="day-scoping-label">' + t.messages.length + ' message' + (t.messages.length === 1 ? '' : 's') + ' on this date</div>'
      : '';

    var bodyHtml;
    if (t.summaryStatus === 'ok') {
      bodyHtml = '<div class="summary-text">' + escapeHtml(displaySummary(t.summary)) + '</div>';
    } else if (t.summaryStatus === 'skipped-low-text') {
      bodyHtml = '<div class="summary-status-note">Skipped — low text content / possibly image-heavy email.</div>';
    } else if (t.summaryStatus === 'failed') {
      bodyHtml = '<div class="summary-status-note failed">Summary failed: ' + escapeHtml(t.summaryError || 'unknown error') + '</div>';
    } else {
      bodyHtml = '<div class="summary-status-note">Summary pending.</div>';
    }

    return (
      '<div class="card" id="summary-' + t.threadId + '" data-thread-id="' + t.threadId + '">' +
        '<div class="card-header">' +
          '<div>' +
            '<div class="card-subject">' + numberedSubject(t, i) + '</div>' +
            metaLines(t) +
            '<div class="mono">Thread ID: ' + escapeHtml(t.threadId) + '</div>' +
            scopeLabel +
          '</div>' +
          '<div class="status-icons">' +
            '<span class="state-chip' + (state.isRead ? '' : ' unread') + '" aria-label="Status">' + (state.isRead ? 'Read' : '● Unread') + '</span>' +
            '<button class="icon-btn read-action" data-thread-id="' + t.threadId + '">' + (state.isRead ? 'Mark unread' : 'Mark read') + '</button>' +
            '<button class="icon-btn star-toggle' + (state.isStarred ? ' active' : '') + '" data-thread-id="' + t.threadId + '">' + (state.isStarred ? '★ Starred' : '☆ Star') + '</button>' +
          '</div>' +
        '</div>' +
        bodyHtml +
        '<div style="margin-top:0.6rem;"><span class="jump-link" data-jump-target="full-' + t.threadId + '">Jump to full email →</span></div>' +
      '</div>'
    );
  }

  function renderFullEmailCard(t, i) {
    var messagesHtml = t.messages.map(function (m) {
      var truncatedNote = m.truncated
        ? ' <button class="icon-btn load-full-body" data-message-id="' + m.messageId + '">Load full body</button>'
        : '';
      return (
        '<div class="message-block" data-message-id="' + m.messageId + '">' +
          '<div class="mono">' + escapeHtml(m.timestamp) + ' · Message ID: ' + escapeHtml(m.messageId) + '</div>' +
          '<div class="message-from"><span class="sender-name">' + escapeHtml(senderDisplayName(m.from)) + '</span>' +
            '<span class="msg-time">' + escapeHtml(timeOf(m.timestamp)) + '</span>' + truncatedNote + '</div>' +
          '<div class="raw-from">' + escapeHtml(m.from) + '</div>' +
          '<div class="message-body">' + escapeHtml(m.lowText ? '(Low text content / possibly image-heavy email)' : m.body) + '</div>' +
        '</div>'
      );
    }).join('');

    return (
      '<div class="card" id="full-' + t.threadId + '">' +
        '<div class="card-subject">' + numberedSubject(t, i) + '</div>' +
        '<div class="mono">Thread ID: ' + escapeHtml(t.threadId) + '</div>' +
        '<div style="margin-top:0.5rem;"><span class="jump-link" data-jump-target="summary-' + t.threadId + '">↑ Back to summary</span></div>' +
        messagesHtml +
      '</div>'
    );
  }

  function scrollToId(id) {
    var el = byId(id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function wireContentsJumpLinks() {
    document.querySelectorAll('[data-jump-target]').forEach(function (el) {
      el.addEventListener('click', function () { scrollToId(el.getAttribute('data-jump-target')); });
    });
  }

  document.querySelectorAll('.jump-bar a').forEach(function (a) {
    a.addEventListener('click', function () { scrollToId(a.getAttribute('data-jump')); });
  });

  // ---- Optimistic UI for read/star toggles ----
  function threadMessageIds(threadId) {
    var t = currentDigest.threads.find(function (t) { return t.threadId === threadId; });
    return t ? t.messages.map(function (m) { return m.messageId; }) : [];
  }

  function setButtonState(threadId, kind, value) {
    var card = document.querySelector('.card[data-thread-id="' + threadId + '"]');
    if (!card) return;
    if (kind === 'read') {
      var chip = card.querySelector('.state-chip');
      chip.textContent = value ? 'Read' : '● Unread';
      chip.classList.toggle('unread', !value);
      card.querySelector('.read-action').textContent = value ? 'Mark unread' : 'Mark read';
    } else {
      var sbtn = card.querySelector('.star-toggle');
      sbtn.textContent = value ? '★ Starred' : '☆ Star';
      sbtn.classList.toggle('active', value);
    }
    currentReadStarState[threadId] = currentReadStarState[threadId] || {};
    currentReadStarState[threadId][kind === 'read' ? 'isRead' : 'isStarred'] = value;
  }

  // Server functions return {succeeded, failed} and only throw on a hard
  // error, so a per-message failure arrives via the SUCCESS handler. Treat a
  // non-empty `failed` list as a failure too.
  function describeFailures(result) {
    var failed = (result && result.failed) || [];
    if (!failed.length) return '';
    var first = failed[0];
    return failed.length + ' message' + (failed.length === 1 ? '' : 's') + ' failed (' + (first.error || 'unknown error') + ')';
  }

  function wireToggle(selector, kind, stateKey, fnOn, fnOff) {
    document.querySelectorAll(selector).forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (btn.disabled) return;
        var threadId = btn.getAttribute('data-thread-id');
        var digestAtClick = currentDigest;
        var was = !!(currentReadStarState[threadId] || {})[stateKey];
        var next = !was;
        setButtonState(threadId, kind, next); // optimistic
        btn.disabled = true;
        var ids = threadMessageIds(threadId);
        function revert(msg) {
          btn.disabled = false;
          if (currentDigest !== digestAtClick) return; // user switched dates
          setButtonState(threadId, kind, was);
          alert('Gmail sync failed: ' + msg);
        }
        google.script.run
          .withSuccessHandler(function (result) {
            var problem = describeFailures(result);
            if (problem) { revert(problem); return; }
            btn.disabled = false;
          })
          .withFailureHandler(function (err) { revert((err && err.message) || err); })
          [next ? fnOn : fnOff](ids);
      });
    });
  }

  function wireStatusIconButtons() {
    wireToggle('.read-action', 'read', 'isRead', 'markThreadRead', 'markThreadUnread');
    wireToggle('.star-toggle', 'star', 'isStarred', 'starThread', 'unstarThread');
  }

  function wireFullBodyButtons() {
    document.querySelectorAll('.load-full-body').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var messageId = btn.getAttribute('data-message-id');
        btn.disabled = true;
        btn.textContent = 'Loading…';
        google.script.run
          .withSuccessHandler(function (fullBody) {
            var block = document.querySelector('.message-block[data-message-id="' + messageId + '"] .message-body');
            if (block) block.textContent = fullBody;
            btn.remove();
          })
          .withFailureHandler(function (err) {
            btn.disabled = false;
            btn.textContent = 'Load full body (failed, retry)';
            alert('Could not load full body: ' + (err.message || err));
          })
          .getFullMessageBody(messageId);
      });
    });
  }

  // ---- Mark all read (applies to every thread, including starred ones) ----
  // F2: progress while running, then an explicit success or a clear error.
  byId('mark-all-read-btn').addEventListener('click', function () {
    if (!currentDigest || bulkInFlight) return;
    var btn = byId('mark-all-read-btn');
    var digestAtClick = currentDigest;
    var threads = digestAtClick.threads;
    var n = threads.length;
    var label = n + ' thread' + (n === 1 ? '' : 's');
    var allIds = [];
    var priorRead = {};
    var threadOfMessage = {};
    threads.forEach(function (t) {
      priorRead[t.threadId] = !!(currentReadStarState[t.threadId] || {}).isRead;
      t.messages.forEach(function (m) { allIds.push(m.messageId); threadOfMessage[m.messageId] = t; });
      setButtonState(t.threadId, 'read', true); // optimistic, every thread including starred
    });

    bulkInFlight = true;
    btn.disabled = true;
    setBulkStatus('Marking ' + label + ' read…');

    function finish() { bulkInFlight = false; btn.disabled = false; }
    function revertThreads(list) {
      if (currentDigest !== digestAtClick) return;
      list.forEach(function (t) { setButtonState(t.threadId, 'read', priorRead[t.threadId]); });
    }

    google.script.run
      .withSuccessHandler(function (result) {
        finish();
        var failed = (result && result.failed) || [];
        if (!failed.length) {
          setBulkStatus('Done: ' + label + ' marked read', 'ok');
          return;
        }
        var badThreads = [];
        var seen = {};
        failed.forEach(function (f) {
          var t = threadOfMessage[f.messageId];
          if (t && !seen[t.threadId]) { seen[t.threadId] = true; badThreads.push(t); }
        });
        revertThreads(badThreads);
        var names = badThreads.slice(0, 3).map(function (t) { return '"' + t.subject + '"'; }).join(', ');
        if (badThreads.length > 3) names += ' and ' + (badThreads.length - 3) + ' more';
        setBulkStatus('Error: ' + badThreads.length + ' of ' + label + ' could not be marked read — ' +
          names + ' (' + (failed[0].error || 'unknown error') + ')', 'error');
      })
      .withFailureHandler(function (err) {
        finish();
        revertThreads(threads);
        setBulkStatus('Error: Mark all read failed — ' + String((err && err.message) || err).replace(/\.+$/, '') + '. Read states were restored on this page; reload to see what Gmail actually has.', 'error');
      })
      .markAllRead(allIds);
  });

  // ---- Regenerate ----
  byId('regenerate-btn').addEventListener('click', function () {
    if (!currentDate) return;
    var btn = byId('regenerate-btn');
    btn.disabled = true;
    btn.textContent = 'Regenerating…';
    google.script.run
      .withSuccessHandler(function (response) {
        btn.disabled = false;
        btn.textContent = 'Regenerate';
        handleDigestResponse(response);
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        btn.textContent = 'Regenerate';
        alert('Regenerate failed: ' + (err.message || err));
      })
      .regenerateDigest(currentDate);
  });

  // ---- Back-to-top ----
  window.addEventListener('scroll', function () {
    byId('back-to-top').style.display = window.scrollY > 400 ? 'block' : 'none';
  });
  byId('back-to-top').addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
</script>
